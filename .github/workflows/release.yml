name: Release Windows exe

# Builds shortcut.exe (Windows x64, self-contained: no .NET install needed),
# tests it, and attaches it to a GitHub Release.
# Start it by pushing a tag (git tag v1.0.0 && git push origin v1.0.0)
# or from the Actions tab with "Run workflow".

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number, for example 1.0.0'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Work out the version
        run: |
          $v = if ('${{ github.event_name }}' -eq 'push') { '${{ github.ref_name }}'.TrimStart('v') } else { '${{ inputs.version }}'.TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$v' must look like 1.2.3" }
          "VERSION=$v" | Out-File -Append $env:GITHUB_ENV

      - name: Build shortcut.exe
        run: >
          dotnet publish ShortcutMaster/ShortcutMaster.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PackAsTool=false
          -p:Version=${{ env.VERSION }}
          -p:IncludeSourceRevisionInInformationalVersion=false
          -o publish

      - name: Test shortcut.exe
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'appdata'
          New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          $exe = Resolve-Path publish/shortcut.exe

          $version = & $exe --version
          if ($version -ne $env:VERSION) { throw "Expected version $env:VERSION, got '$version'" }

          & $exe add hi "echo hello from shortcutmaster"
          if ($LASTEXITCODE -ne 0) { throw 'add failed' }

          $out = & $exe run hi
          if (-not ($out -match 'hello from shortcutmaster')) { throw "run printed: $out" }

          & $exe list
          & $exe remove hi
          if ($LASTEXITCODE -ne 0) { throw 'remove failed' }
          Write-Host 'shortcut.exe works.'

      - name: Package
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item publish/shortcut.exe dist/shortcut.exe
          $zipDir = Join-Path $env:RUNNER_TEMP "ShortcutMaster-$env:VERSION-win-x64"
          New-Item -ItemType Directory -Force $zipDir | Out-Null
          Copy-Item publish/shortcut.exe, README.md $zipDir
          Compress-Archive -Path "$zipDir/*" -DestinationPath "dist/ShortcutMaster-$env:VERSION-win-x64.zip"
          Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $notes = @"
          ShortcutMaster $env:VERSION for Windows (64-bit). No .NET installation needed.

          **Install:** download shortcut.exe, then follow "Install with shortcut.exe" in the README.

          The exe is not code-signed, so Windows SmartScreen may warn on first run. Verify the file with SHA256SUMS.txt.
          "@
          $existing = gh release list --limit 100 --json tagName --jq '.[].tagName'
          if ($existing -contains $tag) {
            gh release upload $tag (Get-ChildItem dist -File).FullName --clobber
          } else {
            gh release create $tag (Get-ChildItem dist -File).FullName --title "ShortcutMaster $env:VERSION" --notes $notes
          }
